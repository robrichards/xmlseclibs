name: Tests

on: [push, pull_request]

jobs:

  tests-eol:
    name: PHP ${{ matrix.php-versions }} Tests
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.0', '8.1']

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit/phpunit:9.6

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Composer packages
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: phpunit --coverage-clover clover.xml tests

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./clover.xml

  tests-support:
    name: PHP ${{ matrix.php-versions }} Tests
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.2', '8.3']

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit/phpunit:9.6

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Composer packages
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: phpunit --coverage-clover clover.xml tests

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./clover.xml

  tests:
    name: PHP ${{ matrix.php-versions }} Tests
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.4', '8.5']

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit/phpunit:9.6

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Composer packages
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: phpunit --coverage-clover clover.xml tests

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./clover.xml

  tests-phpseclib3:
    name: PHP 8.4 phpseclib 3
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpunit/phpunit:9.6

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Composer packages
        uses: ramsey/composer-install@v3

      - name: Pin phpseclib 3
        run: composer require "phpseclib/phpseclib:^3.0" --update-with-dependencies --no-interaction

      - name: Run tests
        run: phpunit tests
